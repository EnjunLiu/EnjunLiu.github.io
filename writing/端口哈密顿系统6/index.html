<!doctype html>
<html lang="zh-CN" class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="cache-control" content="no-cache" />
    <title>私人博客</title>
    <style>:root {
  color-scheme: light;
  --background: #faf9f6;
  --text: #222;
  --muted: #6b6b6b;
  --accent: #b64040;
}

.staticrypt-html,
.staticrypt-body { height: 100%; margin: 0; }
.staticrypt-content {
  min-height: 100%;
  display: grid;
  place-items: center;
  box-sizing: border-box;
  padding: 24px;
  background: var(--background);
  color: var(--text);
  font: 16px/1.6 "Noto Serif SC", "Songti SC", Georgia, serif;
}
.staticrypt-page { width: min(100%, 360px); }
.staticrypt-form { border: 1px solid var(--text); padding: 28px; }
.staticrypt-title { margin: 0 0 12px; font-size: 28px; }
.staticrypt-instructions p + p { color: var(--muted); margin: 0 0 24px; }
.staticrypt-password-container { position: relative; margin-bottom: 16px; }
.staticrypt-password-container input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid var(--muted);
  border-radius: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
}
.staticrypt-password-container input:focus { outline: 1px solid var(--accent); }
.staticrypt-decrypt-button {
  width: 100%;
  padding: 10px 16px;
  border: 1px solid var(--accent);
  border-radius: 0;
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-size: 20px;
  cursor: pointer;
}
.staticrypt-decrypt-button:hover { text-decoration: underline; }
.staticrypt-decrypt-button:disabled { opacity: .6; cursor: wait; }
.staticrypt-error { color: var(--accent); margin: 12px 0 0; }
.hidden { display: none !important; }
.staticrypt-spinner-container {
  height: 100%;
  display: grid;
  place-items: center;
  background: var(--background);
}
.staticrypt-spinner {
  width: 24px;
  height: 24px;
  border: 2px solid var(--muted);
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --background: #181818;
    --text: #e5e3de;
    --muted: #aaa7a1;
    --accent: #e57373;
  }
}
@media (prefers-reduced-motion: reduce) {
  .staticrypt-spinner { animation: none; }
}
