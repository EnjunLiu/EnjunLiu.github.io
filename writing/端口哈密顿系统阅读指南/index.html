<!DOCTYPE html>
<html lang="zh-CN" class="staticrypt-html">
    <head>
        <meta charset="utf-8" /><meta name="robots" content="noindex,nofollow" />
        <title>私人博客</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>:root {
  color-scheme: light;
  --background: #faf9f6;
  --text: #222;
  --muted: #6b6b6b;
  --accent: #b64040;
}

.staticrypt-html,
.staticrypt-body { height: 100%; margin: 0; }
.staticrypt-content {
  min-height: 100%;
  display: grid;
  place-items: center;
  box-sizing: border-box;
  padding: 24px;
  background: var(--background);
  color: var(--text);
  font: 16px/1.6 "Noto Serif SC", "Songti SC", Georgia, serif;
}
.staticrypt-page { width: min(100%, 360px); }
.staticrypt-form { border: 1px solid var(--text); padding: 28px; }
.staticrypt-title { margin: 0 0 12px; font-size: 28px; }
.staticrypt-instructions p + p { color: var(--muted); margin: 0 0 24px; }
.staticrypt-hr { display: none; }
.staticrypt-password-container { position: relative; margin-bottom: 16px; }
.staticrypt-password-container input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 44px 12px 12px;
  border: 1px solid var(--muted);
  border-radius: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
}
.staticrypt-password-container input:focus { outline: 1px solid var(--accent); }
.staticrypt-toggle-password-visibility {
  position: absolute;
  right: 12px;
  top: 50%;
  width: 20px;
  height: 20px;
  transform: translateY(-50%);
  cursor: pointer;
  opacity: .6;
}
.staticrypt-remember {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  color: var(--muted);
}
.staticrypt-remember input { accent-color: var(--accent); }
.staticrypt-decrypt-button {
  width: 100%;
  padding: 10px 16px;
  border: 1px solid var(--accent);
  border-radius: 0;
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-size: 20px;
  cursor: pointer;
}
.staticrypt-decrypt-button:hover { text-decoration: underline; }
.hidden { display: none !important; }
.staticrypt-spinner-container {
  height: 100%;
  display: grid;
  place-items: center;
  background: var(--background);
}
.staticrypt-spinner {
  width: 24px;
  height: 24px;
  border: 2px solid var(--muted);
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --background: #181818;
    --text: #e5e3de;
    --muted: #aaa7a1;
    --accent: #e57373;
  }
  .staticrypt-toggle-password-visibility { filter: invert(1); }
}
@media (prefers-reduced-motion: reduce) {
  .staticrypt-spinner { animation: none; }
}
</style>

                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    </body>
</html>
